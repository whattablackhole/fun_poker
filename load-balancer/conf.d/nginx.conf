

lua_package_path "/usr/local/other/github/fun_poker/?.lua;;";

lua_shared_dict game_servers 10m;

resolver 127.0.0.11 valid=30s;  # Docker's internal DNS server


init_worker_by_lua_block {
    local redis = require "resty.redis"
    local cjson = require "cjson"
    local function process_message(msg)
    local ok, data = pcall(cjson.decode, msg)
    if not ok then
    ngx.log(ngx.ERR, "failed to decode JSON: ", data)
    return
    end
    local gameID = data.game_id
    local serverAddress = data.server_address
    local dict = ngx.shared.game_servers
    local success, err, forcible = dict:set(gameID, serverAddress)
    if not success then
    ngx.log(ngx.ERR, "failed to set shared dict: ", err)
    elseif forcible then
    ngx.log(ngx.WARN, "shared dict entry overwritten")
    else
    ngx.log(ngx.INFO, "shared dict set: ", gameID, " -> ", serverAddress)
    end
    end
    local function redis_subscribe(premature)
    if premature then
    return
    end
    local red = redis:new()
    local redis_host = os.getenv("REDIS_HOST") or "game-cordinator-service"
    local redis_port = tonumber(os.getenv("REDIS_PORT")) or 6379
    local ok, err = red:connect(redis_host, redis_port)
    if not ok then
    ngx.log(ngx.ERR, "failed to connect to Redis: ", err)
    return
    end
    local res, err = red:subscribe("game_servers")
    if not res then
    ngx.log(ngx.ERR, "failed to subscribe: ", err)
    return
    end
    ngx.log(ngx.INFO, "subscribed to Redis channel: game_servers")
    while true do
    local res, err = red:read_reply()
    if res then
    process_message(res[3])
    elseif err == "timeout" then
    ngx.log(ngx.ERR, "error reading reply: ", err)
    elseif err then
    ngx.log(ngx.ERR, "error reading reply: ", err)
    end
    ngx.sleep(1)
    end
    end
    local ok, err = ngx.timer.at(0, redis_subscribe)
    if not ok then
    ngx.log(ngx.ERR, "failed to create timer: ", err)
    end
}

upstream backend {
    server 127.0.0.1:7878;
    server 127.0.0.1:7879;
}


server {
    set_by_lua_block $PUBLIC_KEY {
        local request = require("request")
        local key
        if ngx.var.jwt_public_key_file_path then
        key = request.read_file(ngx.var.jwt_public_key_file_path)
        else
        key = request.read_file("/usr/local/other/github/fun_poker/public_key.pem")
        end
        return key;
    }

    set_by_lua_block $jwt_public_key_file_path {
        if ngx.var.jwt_public_key_file_path then
        return ngx.var.jwt_public_key_file_path;
        else
        return "/usr/local/other/github/fun_poker/public_key.pem";
        end
    }

    set_by_lua_block $ssl_certificate_path {
        if ngx.var.ssl_certificate_path then
        return ngx.ssl_certificate_path;
        else
        return "/usr/local/openresty/certs/localhost.crt";
        end
    }

    set_by_lua_block $ssl_private_key_path {
        if ngx.var.ssl_private_key_path then
        return ngx.ssl_private_key_path;
        else
        return "/usr/local/openresty/certs/localhost.key";
        end
    }


    listen 8082 ssl;
    server_name localhost;
    ssl_certificate $ssl_certificate_path;
    ssl_certificate_key $ssl_private_key_path;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;


    location / {
        proxy_pass https://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /join_lobby {
        set $game_server '';

        access_by_lua_block {
            local jwt = require("resty.jwt")
            local cjson = require("cjson")

            local function get_cookie(name)
            local cookie_value = ngx.var.cookie_auth_token
            return cookie_value
            end

            local token = get_cookie('auth_token')

            local jwt_public_key = ngx.shared.PUBLIC_KEY

            if not token then
            ngx.status = ngx.HTTP_UNAUTHORIZED
            return ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            local jwt_obj = jwt:verify(jwt_public_key, token)

            if not jwt_obj.verified then
            ngx.status = ngx.HTTP_UNAUTHORIZED
            return ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            local claims = jwt_obj.payload
            -- TODO: remove cookie from payload or parse claims on backend
            ngx.req.set_header("X-JWT-Payload", cjson.encode(claims))

            local dict = ngx.shared.game_servers
            local args = ngx.req.get_uri_args()
            local lobby_id = args.lobby_id
            local server, err = dict:get(lobby_id)

            if not server then
            local request = require("request")
            local game_server, err = request.fetch_game_server(lobby_id)

            if game_server then
            ngx.var.game_server = game_server
            else
            ngx.log(ngx.ERR, "Failed to fetch game server: ", err)
            ngx.exit(500)
            end
            else
            ngx.var.game_server = server
            end
        }
        proxy_pass https://$game_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location /ws {
        proxy_pass https://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}