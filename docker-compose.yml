services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: $POSTGRES_AUTH_DB_NAME
      POSTGRES_USER: $POSTGRES_AUTH_USER_NAME
      POSTGRES_PASSWORD: $POSTGRES_AUTH_USER_PASSWORD
    ports:
      - "5433:5432" 
    volumes:
      - pgdata1:/var/lib/postgresql/data
  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    ports:
      - "5004:5004"
    # volumes:
    #   - ./auth-service:/src/auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - DOTNET_USE_RUNNING_IN_CONTAINER=true
      - JWT_SECRET=$JWT_SECRET
      - ENCRYPTION_PASS=$ENCRYPTION_PASS
      - PostgresConnection=Host=auth-db;Database=$POSTGRES_AUTH_DB_NAME;Username=$POSTGRES_AUTH_USER_NAME;Password=$POSTGRES_AUTH_USER_PASSWORD
    depends_on:
      - auth-db
  game-service-db:
    image: postgres:16-alpine
    container_name: game-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPORT: 5434
    ports:
      - "5434:5434"
    volumes: 
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - pgdata2:/var/lib/postgresql/data
  game-service:
    container_name: game-service
    build:
      context: ./game-service
      dockerfile: Dockerfile.dev
    ports:
      - "7878:7878"
    environment:
      RUN_IN_DOCKER: true
      IP_PORT: 0.0.0.0:7878
      DATABASE_URL: postgres://$POSTGRES_GAME_SERVICE_USER_NAME:$POSTGRES_GAME_SERVICE_USER_PASSWORD@game-service-db:5434/$POSTGRES_GAME_SERVICE_DB_NAME
    volumes:
      - target-cache:/app/target
      - cargo-cache:/usr/local/cargo/registry  
    depends_on:
      - game-service-db
  game-cordinator-service:
    build:
      context: ./game-cordinator-service
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - mynetwork
  bot-player-service:
    build:
      context: ./bot-player-service
      dockerfile: Dockerfile.dev
    environment:
      - GROQ_API=$GROQ_API
    ports:
      - "5000:5000"
    volumes:
      - ./protos:/app/protos
  load-balancer:
    build:
      context: ./load-balancer
      dockerfile: openresty.Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./load-balancer/conf.d:/etc/nginx/conf.d/
      - ./localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./localhost.key:/etc/nginx/ssl/localhost.key
      - ./public_key.pem:/etc/nginx/ssl/public_key.pem
      - ./load-balancer/request.lua:/request.lua
    environment:
      - jwt_public_key_file_path=/etc/nginx/ssl/public_key.pem
      - ssl_certificate_path=/etc/nginx/ssl/localhost.crt
      - ssl_private_key_path=/etc/nginx/ssl/localhost.key
      - REDIS_HOST=game-cordinator-service
      - REDIS_PORT=6379
    depends_on:
      - game-cordinator-service
    networks:
      - mynetwork
volumes:
  cargo-cache:
  pgdata1:
  pgdata2:
  target-cache:
  redis-data:
networks:
  mynetwork:
    driver: bridge